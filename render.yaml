services:
  - type: web
    name: hn-sage
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      # They will need to paste their API key in the Render dashboard
      - key: LLM_API_KEY
        sync: false 